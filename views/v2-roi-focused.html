const RoiFmt = {
  money:  (n) => '$' + Math.round(n).toLocaleString('en-US'),
  money2: (n) => '$' + (Math.round(n * 100) / 100).toFixed(2),
  num:    (n) => Math.round(n).toLocaleString('en-US'),
};

function RoiStep({ n, label, valDisplay, help, children }) {
  return (
    <div className="roi-step">
      <div className="step-head">
        <span className="step-label"><span className="step-n">{n}</span>{label}</span>
        {valDisplay && <span className="step-val">{valDisplay}</span>}
      </div>
      {children}
      {help && <div className="step-help">{help}</div>}
    </div>
  );
}

function RoiPills({ value, onChange, options }) {
  return (
    <div className="roi-pills">
      {options.map(opt => (
        <button key={opt.value} type="button"
          className={'roi-pill' + (opt.value === value ? ' on' : '')}
          onClick={() => onChange(opt.value)}>
          <div className="pill-label">{opt.label}</div>
          <div className="pill-sub">{opt.sub}</div>
        </button>
      ))}
    </div>
  );
}

function RoiSlider({ value, onChange, min, max, step, marks }) {
  const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
  const bg = `linear-gradient(to right, ${V2.coral} 0%, ${V2.coral} ${pct}%, ${V2.line2} ${pct}%, ${V2.line2} 100%)`;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <input type="range" className="roi-slider"
        min={min} max={max} step={step} value={value}
        onChange={e => onChange(+e.target.value)} style={{ background: bg }} />
      {marks && (
        <div className="roi-marks">
          {marks.map((m, i) => <span key={i}>{m}</span>)}
        </div>
      )}
    </div>
  );
}

function RoiStepper({ value, onChange, step = 1, min = 0 }) {
  return (
    <div className="roi-stepper">
      <button type="button" onClick={() => onChange(Math.max(min, value - step))}>−</button>
      <input type="number" value={value} min={min} step={step}
        onChange={e => onChange(Math.max(min, +e.target.value || 0))} />
      <button type="button" onClick={() => onChange(value + step)}>+</button>
    </div>
  );
}

function RoiKpis({ items }) {
  return (
    <div className="roi-kpis">
      {items.map((k, i) => (
        <div key={i} className="roi-kpi">
          <div className="v">{k.value}</div>
          <div className="l">{k.label}</div>
        </div>
      ))}
    </div>
  );
}

function RoiCallout({ icon = '↓', children }) {
  return (
    <div className="roi-callout">
      <div className="roi-callout-icon">{icon}</div>
      <div>{children}</div>
    </div>
  );
}

// ─── v2-roi-combined.jsx ────────────────────────────────────────────────────

const COMBINED_PLAN_OPTIONS = [
  { id: 'basic',      name: 'Basic',      upTo: 300,      monthlyAnnual: 50,   monthlyMonthly: 60,   airate: 0.90 },
  { id: 'pro',        name: 'Pro',        upTo: 2000,     monthlyAnnual: 300,  monthlyMonthly: 360,  airate: 0.90 },
  { id: 'advanced',   name: 'Advanced',   upTo: 5000,     monthlyAnnual: 750,  monthlyMonthly: 900,  airate: 0.85 },
  { id: 'enterprise', name: 'Enterprise', upTo: Infinity, monthlyAnnual: 1500, monthlyMonthly: 1800, custom: true, airate: 0.75 },
];

function recommendPlan(monthlyTickets) {
  return COMBINED_PLAN_OPTIONS.find(p => monthlyTickets <= p.upTo) || COMBINED_PLAN_OPTIONS[COMBINED_PLAN_OPTIONS.length - 1];
}

const COMBINED_LABOR_LIFT = 0.25;

function useCombinedRoi(defaults = {}) {
  const [scenario,   setScenario]   = React.useState('ai');
  const [revenueOn,  setRevenueOn]  = React.useState(defaults.revenueOn ?? true);
  const [billing,    setBilling]    = React.useState('annual');
  const [tickets,    setTickets]    = React.useState(defaults.tickets ?? 2000);
  const [agents,     setAgents]     = React.useState(defaults.agents ?? 6);
  const [salary,     setSalary]     = React.useState(defaults.salary ?? 52000);
  const [toolspend,  setToolspend]  = React.useState(defaults.toolspend ?? 600);
  const [rate,       setRate]       = React.useState(defaults.rate ?? 45);
  const [traffic,    setTraffic]    = React.useState(defaults.traffic ?? 100000);
  const [presales,   setPresales]   = React.useState(defaults.presales ?? 20);
  const [chatRate,   setChatRate]   = React.useState(defaults.chatRate ?? 1.5);
  const [baseCR,     setBaseCR]     = React.useState(defaults.baseCR ?? 2.5);
  const [aov,        setAov]        = React.useState(defaults.aov ?? 90);
  const [saUplift,   setSaUplift]   = React.useState(defaults.saUplift ?? 82);
  const [attrib,     setAttrib]     = React.useState(defaults.attrib ?? 70);

  const aiOn = scenario === 'ai';
  const revenueActive = aiOn && revenueOn;
  const saOn = revenueActive;
  const setAiOn = (v) => setScenario(v ? 'ai' : 'helpdesk');
  const setRevenue = (v) => { setRevenueOn(v); if (v) setScenario('ai'); };

  const laborCurrent = agents * salary;
  const toolsCurrent = toolspend * 12;
  const baseYearly = laborCurrent + toolsCurrent;
  const ticketsYr = tickets * 12;
  const costPerTicketToday = ticketsYr > 0 ? baseYearly / ticketsYr : 0;

  const plan = recommendPlan(tickets);
  const planMonthly = billing === 'annual' ? plan.monthlyAnnual : plan.monthlyMonthly;
  const planAnnual = planMonthly * 12;
  const planSavingsVsMonthly = (plan.monthlyMonthly - plan.monthlyAnnual) * 12;
  const airate = plan.airate;

  const laborWithHelpdesk = laborCurrent * (1 - COMBINED_LABOR_LIFT);
  const hdYearly = laborWithHelpdesk + planAnnual;
  const hdSaved = Math.max(0, baseYearly - hdYearly);

  const autoResolved = tickets * (rate / 100);
  const humanHandled = tickets - autoResolved;
  const humanFraction = tickets > 0 ? humanHandled / tickets : 0;
  const laborWithAi = laborWithHelpdesk * humanFraction;
  const aiSpend = autoResolved * airate * 12;
  const hdAiYearly = laborWithAi + planAnnual + aiSpend;
  const hdAiSaved = Math.max(0, baseYearly - hdAiYearly);
  const aiUplift = Math.max(0, hdYearly - hdAiYearly);

  const saConversationsPerMo = traffic * (presales / 100) * (chatRate / 100);
  const saBaselineOrdersMo = saConversationsPerMo * (baseCR / 100);
  const saIncrementalOrdersMo = saBaselineOrdersMo * (saUplift / 100);
  const saAttributedOrdersMo = saIncrementalOrdersMo * (attrib / 100);
  const saRevenueAnnual = saAttributedOrdersMo * aov * 12;
  const saRevenueMonthly = saRevenueAnnual / 12;
  const totalWithRevenue = hdAiSaved + saRevenueAnnual;

  const savedNow = saOn ? totalWithRevenue : aiOn ? hdAiSaved : hdSaved;
  const yearlyNow = aiOn ? hdAiYearly : hdYearly;
  const pct = baseYearly > 0 ? Math.round((Math.max(0, aiOn ? hdAiSaved : hdSaved) / baseYearly) * 100) : 0;
  const gorgiasSpendNow = aiOn ? (planAnnual + aiSpend) : planAnnual;
  const returnMult = gorgiasSpendNow > 0 ? ((saOn ? totalWithRevenue : savedNow) / gorgiasSpendNow).toFixed(1) : '0';
  const laborNow = aiOn ? laborWithAi : laborWithHelpdesk;

  return {
    scenario, setScenario, aiOn, setAiOn, saOn, revenueOn, revenueActive, setRevenue,
    billing, setBilling, tickets, setTickets, agents, setAgents, salary, setSalary,
    toolspend, setToolspend, rate, setRate, airate,
    traffic, setTraffic, presales, setPresales, chatRate, setChatRate,
    baseCR, setBaseCR, aov, setAov, saUplift, setSaUplift, attrib, setAttrib,
    plan, planAnnual, planMonthly, planSavingsVsMonthly,
    baseYearly, laborCurrent, toolsCurrent, costPerTicketToday,
    hdYearly, hdSaved, laborWithHelpdesk,
    autoResolved, humanHandled, aiSpend, laborWithAi,
    hdAiYearly, hdAiSaved, aiUplift,
    saConversationsPerMo, saBaselineOrdersMo, saIncrementalOrdersMo,
    saAttributedOrdersMo, saRevenueAnnual, saRevenueMonthly, totalWithRevenue,
    savedNow, yearlyNow, pct, returnMult, gorgiasSpendNow, laborNow,
  };
}

      <span>{label}</span>
      {sub && (
        <span style={{
          fontSize: 10, fontWeight: 600, padding: '2px 6px', borderRadius: 999,
          background: billing === val ? V2.coral : V2.bgCoralSoft,

        }}>{sub}</span>
      )}
    </button>
  );
  const savingsLabel = st && st.planSavingsVsMonthly > 0 ? `−$${RoiFmt.num(st.planSavingsVsMonthly)}/yr` : 'Save';

    <div style={{ display: 'inline-flex', padding: 3, background: '#fff', border: `1px solid ${V2.line}`, borderRadius: 999, gap: 0 }}>

}

function CombinedRoiScenarioToggle({ scenario, setScenario }) {

          <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: V2.ink3, marginBottom: 10, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: st.aiOn ? V2.coral : V2.ink4 }}></span>
            With Gorgias {st.aiOn ? '+ AI Agent' : '(Helpdesk only)'}
          </div>
          {row(
            `Agent labor (${Math.round(COMBINED_LABOR_LIFT * 100)}% productivity lift${st.aiOn ? `, ${Math.round((1 - st.humanHandled / st.tickets) * 100)}% deflected` : ''})`,
            RoiFmt.money(st.laborNow), { dot: '#CBC6C2' }
          )}
          {row(
            <span>Gorgias <strong style={{ color: V2.ink, fontWeight: 500 }}>{st.plan.name}</strong> plan{st.plan.custom ? ' (est.)' : ''} · {st.billing === 'annual' ? 'billed yearly' : 'billed monthly'}</span>,
            RoiFmt.money(st.planAnnual), { dot: V2.ink }
          )}
          {st.aiOn && row(
            `AI Agent (${RoiFmt.num(st.autoResolved)} automated interactions/mo × $${st.airate.toFixed(2)})`,
            RoiFmt.money(st.aiSpend), { dot: V2.coral }
          )}
          {row('Tools replaced by Gorgias', 'Removed', { muted: true, accent: V2.green })}
          {st.saOn && (
            <div style={{ marginTop: 10, padding: '10px 0', display: 'flex', flexDirection: 'column', gap: 4 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
                <span style={{ fontSize: 12.5, color: V2.ink2, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: V2.green }}></span>
                  Revenue from Shopping Assistant
                </span>
                <span style={{ fontSize: 14, fontWeight: 600, color: V2.green, fontVariantNumeric: 'tabular-nums' }}>+{RoiFmt.money(st.saRevenueAnnual)}</span>
              </div>
              <span style={{ fontSize: 11, color: V2.ink3 }}>
                {RoiFmt.num(st.saAttributedOrdersMo)} incremental orders/mo × ${st.aov} AOV × 12 · attribution {st.attrib}% · included in AI Agent, no extra cost
              </span>
            </div>
          )}
          {row(
            st.saOn ? 'Net annual value' : 'Total',
            st.saOn ? RoiFmt.money(st.totalWithRevenue) : RoiFmt.money(st.yearlyNow),
            { big: true, last: true, accent: V2.ink, style: { paddingTop: 12 } }
          )}
          <div style={{ fontSize: 11.5, color: V2.ink3, marginTop: 10, lineHeight: 1.4 }}>
            {st.saOn
              ? <span><span style={{ color: V2.coralDeep, fontWeight: 500 }}>{RoiFmt.money(st.hdAiSaved)}</span> support cost saved <span style={{ color: V2.ink4 }}>·</span> <span style={{ color: V2.green, fontWeight: 500 }}>+{RoiFmt.money(st.saRevenueAnnual)}</span> Shopping Assistant revenue</span>
              : <span>{RoiFmt.money(st.savedNow)} less than today ({st.pct}% reduction)</span>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

function CombinedRoiChart({ st }) {
  const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, ReferenceLine, Label, Customized } = window.Recharts || {};
  const laborFill = '#CBC6C2';
  const toolsFill = '#9FA5AE';
  const planFill  = V2.ink;
  const dimAi = !st.aiOn;

  const data = [
    { name: 'Today',               labor: st.laborCurrent,      tools: st.toolsCurrent, plan: 0,            ai: 0 },
    { name: 'With Helpdesk',       labor: st.laborWithHelpdesk, tools: 0,               plan: st.planAnnual, ai: 0 },
    { name: 'Helpdesk + AI Agent', labor: st.laborWithAi,       tools: 0,               plan: st.planAnnual, ai: st.aiSpend },
  ].map(d => ({ ...d, total: d.labor + d.tools + d.plan + d.ai }));

  const fmtMoney = v => RoiFmt.money(v);
  const refY     = st.aiOn ? st.hdAiYearly : st.hdYearly;
  const refSaved = st.aiOn ? st.hdAiSaved  : st.hdSaved;

  const ChartTotals = (cp) => {
    const xMap = cp.xAxisMap, yMap = cp.yAxisMap;
    if (!xMap || !yMap) return null;
    const xAxis = xMap[Object.keys(xMap)[0]], yAxis = yMap[Object.keys(yMap)[0]];
    if (!xAxis || !yAxis || !xAxis.scale || !yAxis.scale) return null;
    const xScale = xAxis.scale, yScale = yAxis.scale;
    const bw = xScale.bandwidth ? xScale.bandwidth() : 0;
    return (
      <g>
        {data.map((d, i) => (
          <text key={i} x={xScale(d.name) + bw / 2} y={yScale(d.total) - 12}
            textAnchor="middle" fill={V2.ink} fontSize={13} fontWeight={600} fontFamily={V2.font}>
            {fmtMoney(d.total)}
          </text>
        ))}
      </g>
    );
  };

  return (
    <div className="card" style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        <h3 className="h3" style={{ fontSize: 22 }}>Annual support cost across scenarios</h3>
        <span className="muted" style={{ fontSize: 13 }}>
          Each bar stacks the line items behind that total.
          {st.revenueActive && ' Shopping Assistant adds revenue on top — shown below, not as a cost.'}
        </span>
      </div>

      {!BarChart ? (
        <div style={{ height: 320, display: 'flex', alignItems: 'center', justifyContent: 'center', color: V2.ink3, fontSize: 13 }}>Loading chart…</div>
      ) : (
        <div style={{ width: '100%', height: 380 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={data} margin={{ top: 48, right: 24, left: 8, bottom: 8 }} barCategoryGap="24%">
              <CartesianGrid stroke={V2.line2} vertical={false} />
              <XAxis dataKey="name" axisLine={{ stroke: V2.line }} tickLine={false}
                tick={{ fill: V2.ink2, fontSize: 12, fontFamily: V2.font, fontWeight: 500 }} tickMargin={10} interval={0} />
              <YAxis hide domain={[0, max => max * 1.16]} />
              <Tooltip
                cursor={{ fill: V2.bgCoralSoft, opacity: 0.6 }}
                contentStyle={{ background: V2.ink, color: '#fff', border: 'none', borderRadius: 10, fontSize: 12, padding: '8px 12px', boxShadow: '0 6px 20px rgba(0,0,0,.18)' }}
                labelStyle={{ color: '#fff', fontWeight: 600, marginBottom: 4 }}
                itemStyle={{ color: '#fff', padding: 0 }}
                formatter={(v, name) => [fmtMoney(v), { labor: 'Agent labor', tools: 'Tool stack', plan: 'Gorgias plan', ai: 'AI Agent' }[name] || name]}
              />
              <Bar dataKey="labor" stackId="a" maxBarSize={96}>
                {data.map((_, i) => <Cell key={i} fill={laborFill} fillOpacity={dimAi && i === 2 ? 0.34 : 1} />)}
              </Bar>
              <Bar dataKey="tools" stackId="a" maxBarSize={96}>
                {data.map((_, i) => <Cell key={i} fill={toolsFill} />)}
              </Bar>
              <Bar dataKey="plan" stackId="a" maxBarSize={96}>
                {data.map((_, i) => <Cell key={i} fill={planFill} fillOpacity={dimAi && i === 2 ? 0.34 : 1} />)}
              </Bar>
              <Bar dataKey="ai" stackId="a" radius={[8, 8, 0, 0]} maxBarSize={96}>
                {data.map((_, i) => (
                  <Cell key={i} fill={V2.coral} fillOpacity={dimAi && i === 2 ? 0.3 : 1}
                    stroke={dimAi && i === 2 ? V2.coral : 'none'} strokeDasharray={dimAi && i === 2 ? '4 3' : '0'} />
                ))}
              </Bar>
              {Customized && <Customized component={ChartTotals} />}
              {refSaved > 0 && (
                <ReferenceLine y={refY} stroke={V2.coralDeep} strokeDasharray="4 3" strokeWidth={1.5} ifOverflow="extendDomain">
                  <Label value={`Saved vs today: ${fmtMoney(refSaved)}`} position="insideTopLeft" fill={V2.coralDeep} fontSize={12} fontWeight={700} offset={8} />
                </ReferenceLine>
              )}
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}

      <div className="roi-legend">
        <div><span className="sw" style={{ background: laborFill }}></span>Agent labor</div>
        <div><span className="sw" style={{ background: toolsFill }}></span>Current tool stack</div>
        <div><span className="sw" style={{ background: planFill }}></span>Gorgias plan ({st.plan.name})</div>
        <div><span className="sw" style={{ background: V2.coral, opacity: dimAi ? 0.34 : 1 }}></span>AI Agent{dimAi && ' (off)'}</div>
        <div><span className="sw" style={{ background: 'transparent', border: `1px dashed ${V2.coralDeep}` }}></span>Savings vs today</div>
      </div>

      <RoiCallout icon={st.revenueActive ? '↑' : st.aiOn ? '⚡' : '↓'}>
        {st.revenueActive ? (
          <span>
            On the <b>{st.plan.name}</b> plan you cut support spend by <b>{RoiFmt.money(st.hdAiSaved)}/yr</b>.
            Shopping Assistant — included in AI Agent at no extra cost — adds{' '}
            <b style={{ color: V2.green }}>+{RoiFmt.money(st.saRevenueAnnual)}/yr</b> in revenue
            ({RoiFmt.num(st.saAttributedOrdersMo)} incremental orders/mo at {st.attrib}% attribution),
            for <b style={{ color: V2.green }}>{RoiFmt.money(st.totalWithRevenue)}</b> total annual value.
          </span>
        ) : st.aiOn ? (
          <span>
            On the <b>{st.plan.name}</b> plan, you spend <b>{RoiFmt.money(st.gorgiasSpendNow)}/yr</b> with Gorgias
            (plan + AI usage) but cut your total support spend by <b>{RoiFmt.money(st.hdAiSaved)}</b>.
            That's a <b>{st.returnMult}×</b> return on Gorgias spend.
          </span>
        ) : (
          <span>
            On the <b>{st.plan.name}</b> plan ({RoiFmt.money(st.planAnnual)}/yr), Helpdesk alone saves <b>{RoiFmt.money(st.hdSaved)}</b>.
            Add AI Agent and total savings rise to <b>{RoiFmt.money(st.hdAiSaved)}</b>.
          </span>
        )}
      </RoiCallout>
    </div>
  );
}

const COMBINED_SOURCES = [
  { label: 'Fully-loaded agent cost', figure: '$30K–$120K/yr range · $52K default', source: 'U.S. Bureau of Labor Statistics, Customer Service Representatives (43-4051), median wages + ~30% benefits load', note: 'Adjustable per user input. Default reflects North-American ecommerce support roles.' },
  { label: 'Helpdesk productivity lift', figure: '25% labor capacity reclaimed', source: 'Gorgias internal benchmark. Ticket-handle-time delta measured across 2,000+ Shopify brands (12-month cohort)', note: 'Time savings from unified inbox + macros + integrations. Modeled as labor cost × 0.75.' },
  { label: 'Automation rate', figure: '30–60% typical range · 45% default', source: 'Gorgias AI Agent deployment data, median across active customers (2025)', note: 'Brand averages range from 15% (custom-heavy categories) to 70% (high-volume DTC). Adjust the slider.' },
  { label: 'Price per automated interaction', figure: '$0.75–$0.90 per automated interaction', source: 'Gorgias 2026 list price, tier-based volume discount', note: 'Basic/Pro $0.90 · Advanced $0.85 · Enterprise $0.75. Set automatically by your recommended plan tier.' },
  { label: 'Gorgias plan prices', figure: '$50–$1,500/mo · ticket-volume-based', source: 'gorgias.com/pricing (list price, 2026)', note: 'Annual billing applies a discount vs monthly. Enterprise is illustrative; actual quote depends on volume and features.' },
  { label: 'Shopping Assistant CVR uplift', figure: '82% avg · 89% median (Beauty)', source: 'Gorgias internal ROI Estimator benchmark, Oct 2025 cut across Shopping Assistant-enabled merchants', note: 'Cohort comparison of SA-engaged vs non-engaged sessions. Verticals vary (Beauty 10.6% conv rate, Apparel 9.8%, Footwear 17.7x ROI).' },
  { label: 'Shopping Assistant availability', figure: 'Included in AI Agent (USD-6) · no separate cost', source: 'Gorgias AI Agent USD-6 packaging — the Shopping Assistant skill is enabled by default on AI Agent', note: 'Shopping Assistant conversations are billed as ordinary AI Agent interactions; there is no separate Shopping Assistant line item.' },
  { label: 'GMV-influenced attribution window', figure: '3 days post-conversation', source: 'Gorgias attribution model (2025-08-11 update)', note: 'The "Attribution confidence" slider further discounts this to model truly incremental orders.' },
];

function CombinedRoiMethodology({ st, compact = false, defaultOpen = false }) {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <div className="card" style={{ padding: compact ? 22 : 24, display: 'flex', flexDirection: 'column', gap: open ? 18 : 0 }}>
      <button type="button" onClick={() => setOpen(o => !o)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, background: 'transparent', border: 'none', padding: 0, cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', color: V2.ink }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <h3 className="h3" style={{ fontSize: compact ? 18 : 22 }}>Methodology &amp; sources</h3>
          <span className="muted" style={{ fontSize: 13 }}>Every assumption, every formula. Auditable.</span>
        </div>
        <span style={{ width: 32, height: 32, borderRadius: 999, border: `1px solid ${V2.line}`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: V2.ink2, transition: 'transform .2s', transform: open ? 'rotate(180deg)' : 'rotate(0)' }}>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </span>
      </button>

      {open && (
        <React.Fragment>
          <div style={{ background: '#FAFAFA', borderRadius: 14, padding: '18px 22px', border: `1px solid ${V2.line2}`, display: 'flex', flexDirection: 'column', gap: 10, fontFamily: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace', fontSize: 12.5, color: V2.ink2, lineHeight: 1.6 }}>
            <div style={{ fontSize: 10.5, fontWeight: 700, color: V2.ink3, letterSpacing: '.08em', textTransform: 'uppercase', fontFamily: V2.font, marginBottom: 4 }}>Cost-side formulas</div>
            <div><span style={{ color: V2.ink3 }}>current_stack    =</span> agents × salary + tooling_spend × 12</div>
            <div><span style={{ color: V2.ink3 }}>with_helpdesk    =</span> agents × salary × <strong style={{ color: V2.coralDeep }}>0.75</strong> + plan_annual</div>
            <div><span style={{ color: V2.ink3 }}>auto_resolved    =</span> tickets × ai_rate%</div>
            <div><span style={{ color: V2.ink3 }}>human_share      =</span> (tickets − auto_resolved) / tickets</div>
            <div><span style={{ color: V2.ink3 }}>with_helpdesk_ai =</span> agents × salary × 0.75 × human_share + plan_annual + auto_resolved × ai_$/interaction × 12</div>
            <div style={{ paddingTop: 4 }}><span style={{ color: V2.ink3 }}>cost_savings     =</span> current_stack − chosen_scenario</div>
            <div style={{ fontSize: 10.5, fontWeight: 700, color: V2.green, letterSpacing: '.08em', textTransform: 'uppercase', fontFamily: V2.font, marginTop: 12, marginBottom: 4 }}>Revenue-side formulas (Shopping Assistant — included in AI Agent)</div>
            <div><span style={{ color: V2.ink3 }}>sa_conversations =</span> traffic × presales% × chat_contact%</div>
            <div><span style={{ color: V2.ink3 }}>incremental_orders=</span> sa_conversations × baseline_cvr% × uplift% × attribution%</div>
            <div><span style={{ color: V2.ink3 }}>sa_revenue       =</span> incremental_orders × AOV × 12</div>
            <div style={{ paddingTop: 4 }}><span style={{ color: V2.ink3 }}>total_value      =</span> cost_savings + sa_revenue</div>
          </div>

          <div style={{ background: '#FBFAF8', border: `1px solid ${V2.line}`, borderRadius: 10, padding: '14px 18px', display: 'flex', gap: 12, fontSize: 12, color: V2.ink2, lineHeight: 1.55 }}>
            <div style={{ fontSize: 14, lineHeight: 1, color: '#E0A93B', fontWeight: 700, flexShrink: 0 }}>!</div>
            <div>
              <strong style={{ color: V2.ink, fontWeight: 600 }}>Shopping Assistant uplift benchmarks are directional, not yet causally proven.</strong>
              {' '}The 45–82% lift figures come from cohort comparisons of Shopping Assistant-engaged vs non-engaged sessions and have not been validated by a randomized holdout. Use 40% (Conservative) for CFO-grade modeling.
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
            <div style={{ fontSize: 10.5, fontWeight: 700, color: V2.ink3, letterSpacing: '.08em', textTransform: 'uppercase', marginBottom: 8 }}>Sources</div>
            {COMBINED_SOURCES.map((src, i) => (
              <div key={i} style={{ display: 'grid', gridTemplateColumns: compact ? '1fr' : '180px 1fr', gap: compact ? 4 : 16, padding: '12px 0', borderBottom: i < COMBINED_SOURCES.length - 1 ? `1px solid ${V2.line2}` : 'none', alignItems: 'start' }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                  <span style={{ fontSize: 12.5, fontWeight: 600, color: V2.ink }}>{src.label}</span>
                  <span style={{ fontSize: 11.5, color: V2.coralDeep, fontWeight: 500 }}>{src.figure}</span>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <span style={{ fontSize: 12, color: V2.ink2, lineHeight: 1.5 }}>{src.source}</span>
                  <span style={{ fontSize: 11.5, color: V2.ink3, lineHeight: 1.5 }}>{src.note}</span>
                </div>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ─── CombinedRoiFocusedPage ──────────────────────────────────────────────────
// No nav, hero, email capture, CTA, or footer — just the calculator itself.
function CombinedRoiFocusedPage() {
  const st = useCombinedRoi();
  return (
    <div className="v2" style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh', background: '#FBFAF8' }}>
      <div style={{ width: '100%', maxWidth: 1080, margin: '0 auto', boxSizing: 'border-box', padding: '40px 40px 56px', display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 16, alignItems: 'start' }}>
          <CombinedRoiInputs st={st} />
          <div style={{ position: 'sticky', top: 20 }}>
            <CombinedRoiResults st={st} />
          </div>
        </div>
        <CombinedRoiBreakdown st={st} />
        <CombinedRoiChart st={st} />
        <CombinedRoiMethodology st={st} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CombinedRoiFocusedPage />);
</script>
</body>
</html>
